<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia Digimon World 2</title>
<style>
:root{
  --bg:#0f1420; --panel:#171e2e; --panel2:#1e2739; --line:#2b364d; --text:#e6ebf5; --muted:#94a0b8;
  --accent:#4cc2ff; --accent2:#ffb347; --good:#5ad38a; --bad:#ff6b6b;
  --rookie:#7ad37a; --champion:#4cc2ff; --ultimate:#c08cff; --mega:#ffb347;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:18px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;white-space:nowrap}
header h1 span{color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;color:var(--muted);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button:hover{color:var(--text);background:var(--panel2)}
nav button.on{color:var(--text);background:var(--panel2);border-color:var(--line)}
main{padding:18px 20px;max-width:1400px;margin:0 auto}
.tab{display:none}.tab.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--accent)}
.card h3{font-size:13px;margin:14px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input,select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
button.b{background:var(--accent);color:#04121c;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
button.b.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.split{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}.split .list{max-height:38vh}}
.list{max-height:calc(100vh - 230px);overflow:auto;display:flex;flex-direction:column;gap:2px;margin-top:10px}
.list div{padding:6px 10px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.list div:hover{background:var(--panel2)}
.list div.on{background:var(--panel2);outline:1px solid var(--accent)}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.st-Rookie{color:var(--rookie)}.st-Champion{color:var(--champion)}.st-Ultimate{color:var(--ultimate)}.st-Mega{color:var(--mega)}
a.dl{color:var(--text);text-decoration:none;border-bottom:1px dotted var(--muted);cursor:pointer}
a.dl:hover{color:var(--accent);border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}
.kv b{color:var(--muted);font-weight:500}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
th.sorted::after{content:" ▾"}th.sorted.asc::after{content:" ▴"}
tr.hl td{background:rgba(76,194,255,.12)}
.scroll{max-height:60vh;overflow:auto}
.evo{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:var(--panel2);margin-bottom:6px;flex-wrap:wrap}
.evo.match{outline:2px solid var(--good)}
.evo.nomatch{opacity:.45}
.dp{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent2)}
.tree ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--line)}
.tree>ul{padding-left:0;border:0}
.tree li{margin:5px 0}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px;margin-bottom:10px}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#04121c;display:grid;place-items:center;font-weight:700}
.step .body{background:var(--panel2);border-radius:10px;padding:10px 12px}
.eq{font-size:15px}
.eq .op{color:var(--muted);margin:0 6px}
.big{font-size:22px;font-weight:700}
.msg{padding:10px 12px;border-radius:8px;background:var(--panel2);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.pager{display:flex;gap:8px;align-items:center;margin-top:8px}
.cx{display:inline-block;margin:0 6px;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap}
.cx.dna{background:rgba(255,179,71,.15);color:var(--accent2)}
.cx.ev{background:rgba(90,211,138,.15);color:var(--good)}
.cx i{font-style:normal;opacity:.75}
.nm{font-weight:600;white-space:nowrap}
details.route{background:var(--panel2);border-radius:10px;margin-bottom:6px;border:1px solid transparent}
details.route[open]{border-color:var(--line)}
details.route summary{cursor:pointer;padding:8px 10px;display:flex;gap:10px;align-items:baseline;list-style:none}
details.route summary::-webkit-details-marker{display:none}
.rn{color:var(--muted);font-size:12px;min-width:22px}
.rl{flex:1;line-height:1.9}
.rm{color:var(--muted);font-size:12px;white-space:nowrap}
.rs{padding:4px 10px 8px}
.rs .step .body{background:var(--panel)}
button.b:disabled{opacity:.4;cursor:default}
.colgrid{display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start}
@media (max-width:820px){.colgrid{grid-template-columns:1fr}}
.colrows{display:flex;flex-direction:column;gap:2px;margin-top:10px;max-height:calc(100vh - 380px);min-height:60px;overflow:auto}
.colrow{display:flex;align-items:center;gap:6px 8px;padding:5px 6px 5px 10px;border-radius:7px;flex-wrap:wrap}
.colrow .who{flex:1 1 130px}
.colrow .nums{display:flex;align-items:center;gap:5px}
.colrow:hover{background:var(--panel2)}
.colrow .who{flex:1;min-width:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.colrow input{width:54px;padding:4px 6px}
.lv-bad{color:var(--bad)}
.ownbox .evo .mini{margin-left:auto}
.colrow .dpl{font-size:11px;color:var(--muted)}
button.x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;width:26px;height:26px;cursor:pointer;font:inherit;line-height:1;flex:none}
button.x:hover,button.x:focus-visible{color:var(--bad);border-color:var(--bad)}
button.mini{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;flex:none}
button.mini:hover{border-color:var(--accent);color:var(--accent)}
textarea{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;width:100%;min-height:88px;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
button:focus-visible,a.dl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details.bulk{margin-top:10px}
details.bulk summary{cursor:pointer;color:var(--muted);font-size:13px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.tag.own{color:var(--muted)} .tag.new{color:var(--good)}
.reach{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;background:var(--panel2);margin-bottom:6px}
.reach .rt{min-width:170px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.reach .ways{flex:1;line-height:1.95}
.reach .cx{margin:0 4px 0 0}
.ownbox{background:var(--panel2);border-radius:10px;padding:10px 12px}
.ownbox .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.ownbox .evo{background:var(--panel);margin-bottom:4px}
.lock{font-size:12px;color:var(--muted)}
.gwrap{overflow-x:auto;padding:6px 2px 10px;display:flex}
.gwrap>.gt{margin:0 auto}
.gt{display:flex;flex-direction:column;align-items:center;flex:none}
.gcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-width:150px;text-align:left}
.gcard.own{border-color:var(--good)} .gcard.goal{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gcard .gn{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gcard .gs{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.gbadge{font-size:11px;font-weight:600;border-radius:999px;padding:0 8px;border:1px solid currentColor}
.gbadge.own{color:var(--good)} .gbadge.cap{color:var(--accent2)}
.glbl{font-size:11px;color:var(--muted);padding:3px 8px;position:relative;white-space:nowrap}
.glbl::before,.glbl::after{content:"";position:absolute;left:50%;border-left:1px solid var(--line);height:6px}
.glbl::before{top:-3px}.glbl::after{bottom:-3px}
.glbl.dna{color:var(--accent2)} .glbl.ev{color:var(--good)}
.gkids{display:flex;gap:18px;padding-top:14px;position:relative}
.gkids>.gt{position:relative}
.gkids>.gt::before{content:"";position:absolute;top:-14px;left:-9px;right:-9px;border-top:1px solid var(--line)}
.gkids>.gt:first-child::before{left:50%}.gkids>.gt:last-child::before{right:50%}
.gkids>.gt:only-child::before{display:none}
.gkids>.gt::after{content:"";position:absolute;top:-14px;left:50%;height:14px;border-left:1px solid var(--line)}
ol.gsteps{margin:6px 0 0;padding-left:22px;line-height:1.8}
.plan-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.plan-tabs button.on{border-color:var(--accent);color:var(--accent)}
/* imagens dos Digimons (Image/Digimons/<nome>.png, recortadas do Digievolution Chart) */
.dimg{background:#fff;border-radius:6px;object-fit:contain;flex:none;vertical-align:middle;border:1px solid var(--line)}
.dimg.s{width:28px;height:28px;border-radius:5px}
.dimg.m{width:40px;height:40px}
.dimg.l{width:150px;height:150px;border-radius:12px;padding:4px}
.dimg.none{background:var(--panel2);display:inline-grid;place-items:center;color:var(--muted);font-size:11px}
.li{display:flex;align-items:center;gap:8px;min-width:0}
.dhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dhead .info{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px}
.evo .dimg.s{margin-right:-2px}
td .dimg.s{margin-right:6px}
/* aba Elementos */
.elwrap{display:grid;grid-template-columns:1fr minmax(300px,460px);gap:16px;align-items:start}
@media (max-width:900px){.elwrap{grid-template-columns:1fr}}
.elhow ol{padding-left:20px;margin:8px 0}.elhow li{margin-bottom:8px}.elhow p{margin:6px 0}
.good{color:var(--good)} .bad{color:var(--bad)}
.elsim{display:flex;flex-direction:column;gap:12px}
fieldset.elbox{border:1px solid var(--line);border-radius:10px;padding:8px 12px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:0}
fieldset.elbox legend{color:var(--accent);font-weight:600;padding:0 6px}
.verdict{display:inline-flex;gap:10px;align-items:baseline;font-size:22px;font-weight:700;padding:8px 16px;border-radius:10px}
.verdict span{font-size:15px}
.v-good{background:rgba(90,211,138,.15);color:var(--good)} .v-bad{background:rgba(255,107,107,.15);color:var(--bad)} .v-neu{background:var(--panel2);color:var(--muted)}
.elsrc ul{padding-left:20px;margin:6px 0}.elsrc p{margin:6px 0}

</style>
</head>
<body>
<style>
.lang{margin-left:auto;display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px}
.lang button{background:none;border:0;color:var(--muted);padding:5px 10px;border-radius:6px;cursor:pointer;font:inherit;font-weight:600;font-size:12px}
.lang button.on{background:var(--accent);color:#04121c}
</style>
<header>
  <h1 data-i18n-html="appGuide">Guia <span>Digimon World 2</span></h1>
  <nav id="nav">
    <button data-t="digi" class="on" data-i18n="tabDigi">Digimons</button>
    <button data-t="col" data-i18n="tabCol">Meus Digimons</button>
    <button data-t="evo" data-i18n="tabEvo">Evolução (DP)</button>
    <button data-t="dna" data-i18n="tabDna">Fusão DNA</button>
    <button data-t="plan" data-i18n="tabPlan">Planejador DNA</button>
    <button data-t="skill" data-i18n="tabSkill">Skills</button>
    <button data-t="elem" data-i18n="tabElem">Elementos</button>
  </nav>
  <div class="lang" id="lang" role="group" aria-label="Idioma / Language / Idioma">
    <button data-l="pt" title="Português">PT</button>
    <button data-l="en" title="English">EN</button>
    <button data-l="es" title="Español">ES</button>
  </div>
</header>
<main>

<!-- DIGIMONS -->
<section class="tab on" id="t-digi">
  <div class="split">
    <div class="card">
      <div class="row">
        <input id="dSearch" data-i18n-ph="phSearchDigi" style="flex:1">
      </div>
      <div class="row" style="margin-top:8px">
        <select id="dStage" style="flex:1"><option value="" data-i18n="allStages"></option></select>
        <select id="dType" style="flex:1"><option value="" data-i18n="allTypes"></option></select>
      </div>
      <div class="row" style="margin-top:8px">
        <select id="dSpec" style="flex:1"><option value="" data-i18n="allSpecs"></option></select>
      </div>
      <div class="muted" id="dCount" style="margin-top:8px;font-size:12px"></div>
      <div class="list" id="dList"></div>
    </div>
    <div id="dDetail"></div>
  </div>
</section>

<!-- MEUS DIGIMONS -->
<section class="tab" id="t-col">
  <div class="colgrid">
    <div class="card">
      <h2 data-i18n="colTitle"></h2>
      <div class="muted" style="font-size:12px;margin-bottom:10px" data-i18n="colHint"></div>
      <div class="row">
        <label class="f" style="flex:1;min-width:140px"><span data-i18n="colName"></span><input id="colName" list="dlNames" data-i18n-ph="exAgumon"></label>
        <label class="f"><span>DP</span><input id="colDpIn" type="number" min="0" value="0" style="width:64px"></label>
        <label class="f"><span data-i18n="colLv"></span><input id="colLvIn" type="number" min="1" max="99" placeholder="—" style="width:64px"></label>
        <label class="f"><span data-i18n="colQ"></span><input id="colQIn" type="number" min="0" max="100" placeholder="—" style="width:72px"></label>
        <button class="b" id="colAddB" data-i18n="colAdd"></button>
      </div>
      <details class="bulk">
        <summary data-i18n="colBulk"></summary>
        <div class="muted" style="font-size:12px;margin:6px 0" data-i18n="colBulkHint"></div>
        <textarea id="colBulkTxt" placeholder="Agumon 12 25 80&#10;Gabumon 5&#10;Patamon"></textarea>
        <div class="row" style="margin-top:6px"><button class="b sec" id="colBulkB" data-i18n="colBulkAdd"></button></div>
      </details>
      <div id="colMsg" style="margin-top:8px"></div>
      <div class="row" style="margin-top:12px;justify-content:space-between;align-items:center">
        <span class="muted" id="colCount" style="font-size:12px"></span>
        <button class="mini" id="colClear" data-i18n="colClear"></button>
      </div>
      <div class="colrows" id="colList"></div>
    </div>
    <div>
      <div class="card">
        <div id="colSum"></div>
        <div class="row" style="margin-top:12px;align-items:center">
          <label class="chk"><input type="checkbox" id="colOnlyNew" checked> <span data-i18n="onlyNew"></span></label>
          <label class="f" style="flex-direction:row;align-items:center;gap:8px"><span data-i18n="resStage"></span><select id="colStage"><option value="" data-i18n="allF"></option></select></label>
          <input id="colFilt" data-i18n-ph="resName" style="flex:1;min-width:140px">
        </div>
      </div>
      <div class="card"><h2 data-i18n="newTitle"></h2>
        <div class="muted" style="font-size:12px;margin:-4px 0 10px" data-i18n="newHint"></div>
        <div id="colNew"></div></div>
      <div class="card"><h2 data-i18n="evoTitleCol"></h2><div id="colEvo" class="grid2"></div></div>
      <div class="card"><h2 data-i18n="dnaTitleCol"></h2>
        <div class="muted" style="font-size:12px;margin:-4px 0 10px" data-i18n="dnaLvHint"></div>
        <div id="colDna"></div></div>
    </div>
  </div>
</section>

<!-- EVOLUÇÃO -->
<section class="tab" id="t-evo">
  <div class="card">
    <h2 data-i18n="evoQ"></h2>
    <div class="row">
      <label class="f"><span data-i18n="curDigi"></span><input id="eDigi" list="dlNames" data-i18n-ph="exAgumon"></label>
      <label class="f"><span data-i18n="curDp"></span><input id="eDp" type="number" min="0" value="0" style="width:90px"></label>
    </div>
    <div id="eOut" style="margin-top:12px"></div>
  </div>
  <div class="card">
    <h2 data-i18n="treeTitle"></h2>
    <div class="row">
      <label class="f"><span data-i18n="startFrom"></span><input id="tDigi" list="dlNames" data-i18n-ph="exAgumon"></label>
      <label class="f"><span data-i18n="filterDp"></span><input id="tDp" type="number" min="0" data-i18n-ph="all" style="width:110px"></label>
    </div>
    <div class="muted" style="margin-top:6px;font-size:12px" data-i18n="treeHint"></div>
    <div class="tree" id="tOut" style="margin-top:12px"></div>
  </div>
</section>

<!-- DNA -->
<section class="tab" id="t-dna">
  <div class="card">
    <h2 data-i18n="calcTitle"></h2>
    <div class="row">
      <label class="f"><span data-i18n="parent1"></span><input id="cA" list="dlNames"></label>
      <span class="big muted" style="padding-bottom:4px">+</span>
      <label class="f"><span data-i18n="parent2"></span><input id="cB" list="dlNames"></label>
      <button class="b sec" id="cSwap" data-i18n-title="swap">⇄</button>
    </div>
    <div id="cOut" style="margin-top:12px"></div>
  </div>
  <div class="card">
    <h2 data-i18n="howTitle"></h2>
    <div class="row">
      <label class="f"><span data-i18n="wanted"></span><input id="qRes" list="dlNames" data-i18n-ph="exGreymon"></label>
      <label class="f"><span data-i18n="oneParent"></span><input id="qPar" list="dlNames" data-i18n-ph="any"></label>
    </div>
    <div id="qOut" style="margin-top:12px"></div>
  </div>
  <div class="card">
    <h2 data-i18n="whatTitle"></h2>
    <div class="row">
      <label class="f"><span data-i18n="iHave"></span><input id="wHave" list="dlNames" data-i18n-ph="exAgumon"></label>
      <label class="f"><span data-i18n="filterRes"></span><input id="wFilt" data-i18n-ph="resName"></label>
      <label class="f"><span data-i18n="resStage"></span><select id="wStage"><option value="" data-i18n="allF"></option></select></label>
    </div>
    <div id="wOut" style="margin-top:12px"></div>
  </div>
</section>

<!-- PLANEJADOR -->
<section class="tab" id="t-plan">
  <div class="card">
    <h2 data-i18n="chTitle"></h2>
    <div class="muted" style="font-size:12px;margin:-4px 0 10px" data-i18n="chHint"></div>
    <div class="row">
      <label class="f"><span data-i18n="iWant"></span><input id="chWant" list="dlNames" data-i18n-ph="exGreymon"></label>
      <label class="f"><span data-i18n="chMinLv"></span><input id="chMinLv" type="number" min="1" max="99" placeholder="—" style="width:90px"></label>
      <label class="chk" style="padding-bottom:8px"><input type="checkbox" id="chCap" checked> <span data-i18n="chCapOn"></span></label>
      <label class="f"><span data-i18n="chCapLv"></span><input id="chCapLv" type="number" min="1" max="99" value="13" style="width:90px"></label>
      <div class="f"><span class="muted" style="font-size:12px" data-i18n="chCapSt"></span>
        <div class="row" style="gap:10px;padding:6px 0">
          <label class="chk"><input type="checkbox" class="chSt" value="Rookie" checked> Rookie</label>
          <label class="chk"><input type="checkbox" class="chSt" value="Champion" checked> Champion</label>
          <label class="chk"><input type="checkbox" class="chSt" value="Ultimate"> Ultimate</label>
        </div></div>
    </div>
    <div id="chOut" style="margin-top:14px"></div>
  </div>
  <div class="card">
    <h2 data-i18n="planTitle"></h2>

const STAGES = ["Rookie","Champion","Ultimate","Mega"];

// evoluções
const evoFrom = new Map(), evoTo = new Map();
DATA.evos.forEach(([a,b,mn,mx])=>{
  const e={from:a,to:b,min:mn??0,max:mx};
  (evoFrom.get(a)||evoFrom.set(a,[]).get(a)).push(e);
  (evoTo.get(b)||evoTo.set(b,[]).get(b)).push(e);
});
for (const l of evoFrom.values()) l.sort((x,y)=>x.min-y.min);
const dpTxt = e => e.max==null ? `DP ${e.min}+` : (e.min===e.max ? `DP ${e.min}` : `DP ${e.min}–${e.max}`);
const dpOk = (e,dp) => dp>=e.min && (e.max==null || dp<=e.max);

// fusões: par (ordem não importa) -> resultado
const pairKey = (a,b) => a<b ? a*1000+b : b*1000+a;
const FUS = new Map();
const byResult = new Map();   // resultado -> [[p1,p2]]
const byParent = new Map();   // pai -> [[parceiro,resultado]]
DATA.fus.forEach(([r,a,b])=>{
  FUS.set(pairKey(a,b), r);
  (byResult.get(r)||byResult.set(r,[]).get(r)).push([a,b]);
  (byParent.get(a)||byParent.set(a,[]).get(a)).push([b,r]);
  if (a!==b) (byParent.get(b)||byParent.set(b,[]).get(b)).push([a,r]);
});

function renderE(){
  const n = resolve($("#eDigi").value), dp = +$("#eDp").value||0;
  if(!n){ $("#eOut").innerHTML = `<div class="msg">${T("pickDigi")}</div>`; return; }
  const outs = evoFrom.get(n)||[];
  if(!outs.length){ $("#eOut").innerHTML = `<div class="msg">${T("noEvoListed", esc(n))}</div>`; return; }
  const ok = outs.filter(e=>dpOk(e,dp));
  $("#eOut").innerHTML = (ok.length
      ? `<div style="margin-bottom:10px">${T("withDp", dp, link(n), ok.map(e=>link(e.to)).join(T("or")))}</div>`
      : `<div class="msg" style="margin-bottom:10px">${T("noEvoDp", dp)}</div>`)
    + outs.map(e=>`<div class="evo ${dpOk(e,dp)?"match":"nomatch"}">→ ${linkSt(e.to)} <span class="dp">${dpTxt(e)}</span></div>`).join("");
}
["#eDigi","#eDp"].forEach(s=>$(s).addEventListener("input",renderE));

function renderT(){
  const n = resolve($("#tDigi").value), v=$("#tDp").value, dp = v===""?null:+v;
  if(!n){ $("#tOut").innerHTML = `<div class="msg">${T("pickDigi")}</div>`; return; }
  const rec = (name, seen) => {
    const outs = (evoFrom.get(name)||[]).filter(e=>dp==null||dpOk(e,dp));
    if(!outs.length || seen.has(name)) return "";
    seen = new Set(seen).add(name);
    return `<ul>${outs.map(e=>`<li><span class="dp">${dpTxt(e)}</span> → ${linkSt(e.to)}${rec(e.to,seen)}</li>`).join("")}</ul>`;
  };
  const pre = (evoTo.get(n)||[]).map(e=>`${linkSt(e.from)} <span class="dp">(${dpTxt(e)})</span>`).join(", ");
  $("#tOut").innerHTML = (pre?`<div class="muted" style="margin-bottom:8px">${T("comesFrom")} ${pre}</div>`:"")
    + `<ul><li>${linkSt(n)}${rec(n,new Set())||`<div class="muted">${T("noEvos")}${dp!=null?T("withThatDp"):""}.</div>`}</li></ul>`;
}
["#tDigi","#tDp"].forEach(s=>$(s).addEventListener("input",renderT));

fillSel($("#wStage"), STAGES);
function renderW(){
  const h=resolve($("#wHave").value), f=$("#wFilt").value.trim().toLowerCase(), st=$("#wStage").value;
  if(!h){ $("#wOut").innerHTML=`<div class="msg">${T("pickHave")}</div>`; return; }
  if(!(byParent.get(IDX.get(h))||[]).length){ $("#wOut").innerHTML=`<div class="msg">${T("ruleParent")}</div>`; return; }
  const groups = new Map();
  (byParent.get(IDX.get(h))||[]).forEach(([p,r])=>{
    const rn=N[r]; if(f&&!rn.toLowerCase().includes(f)) return; if(st&&D.get(rn)?.st!==st) return;
    (groups.get(rn)||groups.set(rn,[]).get(rn)).push(N[p]);

  const keys=[...groups.keys()].sort(sortByStage);
  $("#wOut").innerHTML =`<div style="margin-bottom:8px">${T("canMake", link(h), keys.length)}</div>`
    + (keys.length?`<div class="scroll"><table><thead><tr><th>${T("result")}</th><th>${T("fuseWith")}</th></tr></thead><tbody>${
      keys.map(k=>`<tr><td style="white-space:nowrap">${linkSt(k)}</td><td>${groups.get(k).sort().map(link).join(", ")}</td></tr>`).join("")}</tbody></table></div>`:"");
}
["#wHave","#wFilt","#wStage"].forEach(s=>$(s).addEventListener("input",renderW));

// ---------- PLANEJADOR (DNA + evolução, todas as rotas até mínimo+2) ----------
const K = (a,b) => a*1000+b;
const partnersOf = new Map();   // atual*1000+resultado -> [parceiros]
DATA.fus.forEach(([r,a,b])=>{
  (partnersOf.get(K(a,r))||partnersOf.set(K(a,r),[]).get(K(a,r))).push(b);
  if(a!==b) (partnersOf.get(K(b,r))||partnersOf.set(K(b,r),[]).get(K(b,r))).push(a);
});
for (const l of partnersOf.values()) l.sort((x,y)=>N[x].localeCompare(N[y]));
const evoEdge = new Map();
for (const [from,l] of evoFrom) for (const e of l) evoEdge.set(K(IDX.get(from),IDX.get(e.to)), e);
const NEXT = N.map(()=>new Set()), PREV = N.map(()=>new Set());
for (const k of [...partnersOf.keys(), ...evoEdge.keys()]) { const a=Math.floor(k/1000), b=k%1000; NEXT[a].add(b); PREV[b].add(a); }
const NEXTA = NEXT.map(s=>[...s]);
const ROUTE_CAP = 250000, PAGE = 15;

function planRoutes(s, t, extra){
  const dist = new Int16Array(N.length).fill(-1); dist[t]=0; let q=[t];
  while(q.length){ const nq=[]; for(const x of q) for(const p of PREV[x]) if(dist[p]<0){ dist[p]=dist[x]+1; nq.push(p);} q=nq; }
  if(dist[s]<0) return null;
  const m = dist[s], lim = m+extra, buckets = Array.from({length:extra+1},()=>[]);
  const seen = new Uint8Array(N.length), path=[s]; seen[s]=1; let total=0, trunc=false;
  (function rec(x){
    if(x===t){ buckets[path.length-1-m].push(Int16Array.from(path)); if(++total>=ROUTE_CAP) trunc=true; return; }
    for(const r of NEXTA[x]){
      if(trunc) return;
      if(seen[r]||dist[r]<0||path.length+dist[r]>lim) continue;
      seen[r]=1; path.push(r); rec(r); path.pop(); seen[r]=0;
    }
  })(s);
  const routes = buckets.map(b=>b.map(p=>{
    let dna=0, evo=0, dp=0, minP=Infinity;
    for(let i=0;i<p.length-1;i++){
      const e=evoEdge.get(K(p[i],p[i+1]));
      if(e){ evo++; dp=Math.max(dp,e.min); }
      else { dna++; minP=Math.min(minP,partnersOf.get(K(p[i],p[i+1])).length); }
    }
    return {p,dna,evo,dp,minP:minP===Infinity?0:minP};
  }));
  return {m, routes, total, trunc};
}

const SORTS = {
  dna:  (a,b)=>a.dna-b.dna || a.dp-b.dp || b.minP-a.minP,
  evo:  (a,b)=>a.evo-b.evo || a.dp-b.dp || b.minP-a.minP,
  dp:   (a,b)=>a.dp-b.dp || a.dna-b.dna || b.minP-a.minP,
  parc: (a,b)=>b.minP-a.minP || a.dna-b.dna || a.dp-b.dp,
};
const nm = i => `<span class="nm st-${esc(D.get(N[i])?.st)}">${esc(N[i])}</span>`;
function routeLine(r){
  const p=r.p; let h=nm(p[0]);
  for(let i=0;i<p.length-1;i++){
    const e=evoEdge.get(K(p[i],p[i+1]));
    if(e) h+=`<span class="cx ev">${T("evolves")} ${esc(dpTxt(e))}</span>`;
    else { const ps=partnersOf.get(K(p[i],p[i+1])); h+=`<span class="cx dna">DNA + ${esc(N[ps[0]])}${ps.length>1?` <i>(+${ps.length-1})</i>`:""}</span>`; }
    h+=nm(p[i+1]);
  }
  return h;
}
function routeSteps(r){
  const p=r.p; let h="";
  for(let i=0;i<p.length-1;i++){
    const a=N[p[i]], b=N[p[i+1]], e=evoEdge.get(K(p[i],p[i+1])), ps=partnersOf.get(K(p[i],p[i+1]))||[];
    h+=`<div class="step"><div class="n">${i+1}</div><div class="body">`;
    if(e) h+=`<div class="eq">${linkSt(a)}<span class="op">${T("evolvesTo")}</span><strong>${link(b)}</strong> ${stageTag(D.get(b)?.st)} <span class="dp">${dpTxt(e)}</span></div>`;
    else h+=`<div class="eq">${linkSt(a)}<span class="op">${T("dnaWith")}</span><span class="muted">${T("onePartner")}</span><span class="op">=</span><strong>${link(b)}</strong> ${stageTag(D.get(b)?.st)}</div>
      <div style="margin-top:6px;font-size:13px">${T("partners")} (${ps.length}): ${ps.map(x=>link(N[x])).join(", ")}</div>`;
    if(e && ps.length) h+=`<div class="muted" style="margin-top:6px;font-size:12px">${T("alsoDna")} ${ps.map(x=>link(N[x])).join(", ")}</div>`;
    h+=`</div></div>`;
  }
  return h;
}

let planCache = {key:null,res:null}, planPages = [];
function renderP(){
  const h=resolve($("#pHave").value), w=resolve($("#pWant").value), extra=+$("#pExtra").value;
  if(!h||!w){ $("#pOut").innerHTML=`<div class="msg">${T("pickBoth")}</div>`; return; }
  if(h===w){ $("#pOut").innerHTML=`<div class="msg">${T("alreadyHave")}</div>`; return; }
  const key=h+"|"+w+"|"+extra;
  if(planCache.key!==key){
    $("#pOut").innerHTML=`<div class="msg">${T("calc")}</div>`;
    setTimeout(()=>{ planCache={key,res:planRoutes(IDX.get(h),IDX.get(w),extra)}; planPages=planCache.res?planCache.res.routes.map(()=>0):[]; drawP(h,w); }, 10);
    return;
  }
  drawP(h,w);
}
function drawP(h,w){
  const res=planCache.res;
  if(!res){
    const ti=IDX.get(w);
    const why = PREV[ti].size===0 ? " "+T("notGen", esc(w)) : "";
    $("#pOut").innerHTML=`<div class="msg">${T("noRoute", esc(h), esc(w))}${why}</div>`; return;
  }
  const f=$("#pFilt").value.trim().toLowerCase(), sorter=SORTS[$("#pSort").value];
  let hit=null;
  if(f){ hit=new Uint8Array(N.length); N.forEach((n,i)=>{ if(n.toLowerCase().includes(f)) hit[i]=1; }); }
  const uses = r => { if(!hit) return true; const p=r.p;
    for(let i=0;i<p.length;i++){ if(hit[p[i]]) return true;
      if(i<p.length-1 && !evoEdge.has(K(p[i],p[i+1]))) for(const x of partnersOf.get(K(p[i],p[i+1]))) if(hit[x]) return true; }
    return false; };
  let html = `<div style="margin-bottom:12px">${T("shortest", res.m, link(h), link(w))}`
    + res.routes.map((l,i)=>T("nRoutes", fmt(l.length), res.m+i)).join(" · ") + `.</div>`;
  if(res.trunc) html += `<div class="msg" style="margin-bottom:12px">${T("capped", fmt(ROUTE_CAP))}</div>`;
  res.routes.forEach((list,bi)=>{
    const L = list.filter(uses).sort(sorter);
    const pages = Math.max(1,Math.ceil(L.length/PAGE)); if(planPages[bi]>=pages) planPages[bi]=0;
    const pg=planPages[bi], slice=L.slice(pg*PAGE,(pg+1)*PAGE);
    const title = bi===0 ? T("bestTitle", res.m) : T("sugTitle", bi, res.m+bi);
    html += `<h3 style="margin-top:18px">${title} <span class="muted" style="text-transform:none">(${fmt(L.length)}${f?` ${T("of")} ${fmt(list.length)}`:""})</span></h3>`;
    if(!L.length){ html+=`<div class="muted">${T("noRouteF", !!f)}</div>`; return; }
    html += slice.map((r,i)=>`<details class="route"><summary><span class="rn">${pg*PAGE+i+1}</span><span class="rl">${routeLine(r)}</span>
      <span class="rm">${r.dna} DNA · ${r.evo} evo${r.dp?` · DP ${r.dp}+`:""}</span></summary><div class="rs">${routeSteps(r)}</div></details>`).join("");
    if(pages>1) html += `<div class="pager"><button class="b sec" data-pg="${bi}" data-d="-1" ${pg===0?"disabled":""}>${T("prev")}</button>
      <span class="muted">${T("page", pg+1, fmt(pages))}</span><button class="b sec" data-pg="${bi}" data-d="1" ${pg>=pages-1?"disabled":""}>${T("next")}</button></div>`;
  });
  $("#pOut").innerHTML = html;
}
$("#pOut").addEventListener("click", e=>{ const b=e.target.closest("[data-pg]"); if(!b) return;
  planPages[+b.dataset.pg]+= +b.dataset.d; drawP(resolve($("#pHave").value),resolve($("#pWant").value)); });
["#pHave","#pWant","#pExtra"].forEach(s=>$(s).addEventListener("input",renderP));
["#pSort","#pFilt"].forEach(s=>$(s).addEventListener("input",()=>{ planPages=planPages.map(()=>0); renderP(); }));
$("#pSwap").onclick=()=>{ const t=$("#pHave").value; $("#pHave").value=$("#pWant").value; $("#pWant").value=t; renderP(); };

}
["#sSearch","#sType","#sCat","#sElem","#sTarget","#sStage"].forEach(s=>$(s).addEventListener("input",renderS));
document.querySelector("#sTable thead").onclick = ev => { const k=ev.target.dataset.k; if(!k) return;

// ---------- MEUS DIGIMONS ----------
const normName = v => (v||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const resolveLoose = v => resolve(v) || (v && N.find(n=>normName(n)===normName(v))) || null;
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const cleanDp = v => Math.max(0, Math.floor(+v||0));
const cleanLv = v => (v===""||v==null||isNaN(+v)||+v<1) ? null : Math.min(99, Math.floor(+v));
const cleanQ = v => (v===""||v==null||isNaN(+v)) ? null : Math.max(0, Math.min(100, Math.floor(+v)));
const EVO_LV = {Rookie:11, Champion:21, Ultimate:31};   // Lv em que cada estágio evolui
const topStage = (st, lv) => { let i = STAGES.indexOf(st); while (i>=0 && EVO_LV[STAGES[i]]!=null && lv>=EVO_LV[STAGES[i]]) i++; return STAGES[i]; };
const dnaMaxLv = (a,b) => (a==null||b==null) ? null : Math.min(99, Math.max(a,b) + Math.floor(Math.min(a,b)/5));
let COL = [];
try { const s = JSON.parse(localStorage.getItem("dw2guia.col")||"[]");
  if (Array.isArray(s)) COL = s.filter(x=>x&&D.has(x.n)).map(x=>({id:x.id||newId(), n:x.n, dp:cleanDp(x.dp), lv:cleanLv(x.lv), q:cleanQ(x.q)})); } catch(e) {}
const saveCol = () => { try { localStorage.setItem("dw2guia.col", JSON.stringify(COL)); } catch(e) {} };
let colMsg = "", colUndo = null;
fillSel($("#colStage"), STAGES);

function renderColList(){
  $("#colCount").textContent = T("colNTeam", COL.length);
  $("#colClear").disabled = !COL.length;
  $("#colList").innerHTML = COL.length ? COL.map(x=>`<div class="colrow" data-id="${esc(x.id)}">
      <span class="who" style="flex-wrap:nowrap;flex:1 1 170px;min-width:170px">${pic(x.n,"m")}<span style="display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;min-width:0">${linkSt(x.n)}</span></span>
      <span class="nums"><span class="dpl">DP</span><input type="number" min="0" data-f="dp" value="${x.dp}" aria-label="DP ${esc(x.n)}">
      <span class="dpl">${T("colLv")}</span><input type="number" min="1" max="99" data-f="lv" value="${x.lv??""}" placeholder="—" aria-label="${esc(T("colLv"))} ${esc(x.n)}">
      <span class="dpl">${T("colQs")}</span><input type="number" min="0" max="100" data-f="q" value="${x.q??""}" placeholder="—" aria-label="${esc(T("colQ"))} ${esc(x.n)}">
      <button class="x" data-rm="${esc(x.id)}" title="${esc(T("colRemove"))}" aria-label="${esc(T("colRemove"))} ${esc(x.n)}">×</button></span></div>`).join("")
    : `<div class="msg">${T("colEmpty")}</div>`;
  $("#colMsg").innerHTML = colMsg ? `<div class="msg">${colMsg}${colUndo?` <button class="mini" id="colUndoB">${T("undo")}</button>`:""}</div>` : "";
  if (colUndo) $("#colUndoB").onclick = () => { const x = COL.find(c=>c.id===colUndo.id); if (x) x.n = colUndo.n; colUndo = null; colMsg = ""; saveCol(); renderCol(); };
}

function renderColOut(){
  if(!COL.length){ ["#colSum","#colNew","#colEvo","#colDna"].forEach(s=>$(s).innerHTML="");
    $("#colSum").innerHTML = `<div class="msg">${T("colEmpty")}</div>`; return; }
  const owned = new Set(COL.map(x=>x.n));
  const onlyNew = $("#colOnlyNew").checked, st = $("#colStage").value, f = $("#colFilt").value.trim().toLowerCase();
  const show = n => (!onlyNew || !owned.has(n)) && (!st || D.get(n)?.st===st) && (!f || n.toLowerCase().includes(f));
  const reach = new Map(); // resultado -> {evo:[origens], dna:[[a,b]]}
  const addR = (r,k,v) => (reach.get(r)||reach.set(r,{evo:[],dna:[]}).get(r))[k].push(v);
  const own = r => owned.has(r) ? `<span class="tag own">${T("haveIt")}</span>` : `<span class="tag new">${T("newIt")}</span>`;

  // evoluções de cada Digimon da lista
  let nEvo = 0, nWait = 0, nLv = 0; const boxes = [];
  const sorted = [...COL].sort((a,b)=>sortByStage(a.n,b.n) || a.dp-b.dp);
  for (const x of sorted){
    const outs = evoFrom.get(x.n)||[];
    const need = EVO_LV[D.get(x.n)?.st], lvBad = need!=null && x.lv!=null && x.lv<need;
    const rows = outs.map(e=>{
      const ok = dpOk(e,x.dp) && !lvBad;
      if (ok){ nEvo++; addR(e.to,"evo",x.n); } else if (lvBad) nLv++; else if (x.dp<e.min) nWait++;
      if ((st && D.get(e.to)?.st!==st) || (f && !e.to.toLowerCase().includes(f))) return "";
      const why = ok ? "" : lvBad ? T("lvLow", need, x.lv) : x.dp<e.min ? T("needDp", e.min-x.dp) : T("overDp", e.max);
      return `<div class="evo ${ok?"match":"nomatch"}">→ ${picSt(e.to)} <span class="dp">${dpTxt(e)}</span>${why?` <span class="lock">${why}</span>`:""} ${own(e.to)}${ok?`<button class="mini" data-evo="${esc(x.id)}" data-to="${esc(e.to)}">${T("evolveB")}</button>`:""}</div>`;
    }).join("");
    if (!outs.length && (st || f)) continue;
    if (outs.length && !rows) continue;
    boxes.push(`<div class="ownbox"><div class="hd">${pic(x.n,"m")} ${linkSt(x.n)} <span class="dp">DP ${x.dp}</span>${x.lv!=null?` <span class="muted${lvBad?" lv-bad":""}">${T("colLv")} ${x.lv}</span>`:""}${x.q!=null?` <span class="muted">${T("colQs")} ${x.q}</span>`:""}</div>${rows || `<div class="muted">${T("noMoreEvo")}</div>`}</div>`);
  }
  $("#colEvo").innerHTML = boxes.join("") || `<div class="muted">${T("nothingFilt")}</div>`;

  // fusões DNA entre os Digimons da lista
  const pairs = [], seenP = new Map();
  for (let i=0;i<COL.length;i++) for (let j=i+1;j<COL.length;j++){
    const a=COL[i].n, b=COL[j].n, k=pairKey(IDX.get(a),IDX.get(b));
    const r = FUS.get(k); if (r==null) continue;
    const A = COL[i], B = COL[j], lv = dnaMaxLv(A.lv, B.lv), [p,q] = a<=b ? [a,b] : [b,a];
    // qualidade vem do pai de Lv mais alto; com Lv empatado, pode ser qualquer um
    // qualidade vem do pai de Lv mais alto; com Lv empatado, fica a maior. DP = maior DP dos pais + 1
    let qv = null;
    if (A.lv!=null && B.lv!=null){ if (A.lv>B.lv) qv = A.q; else if (B.lv>A.lv) qv = B.q; else qv = (A.q==null||B.q==null) ? null : Math.max(A.q,B.q); }
    const cand = {lv, q:qv, dp:Math.max(A.dp,B.dp)+1};
    const better = (n,o) => (n.lv??-1) - (o.lv??-1) || (n.q??-1) - (o.q??-1) || n.dp - o.dp;
    const prev = seenP.get(k);
    if (prev){ if (better(cand,prev)>0) Object.assign(prev,cand); continue; }   // mesma dupla de espécies: fica a melhor combinação
    const o = {a:p,b:q,r:N[r],...cand}; seenP.set(k,o); pairs.push(o); addR(N[r],"dna",[p,q]);
  }
  const shownPairs = pairs.filter(x=>show(x.r)).sort((x,y)=>sortByStage(x.r,y.r) || x.a.localeCompare(y.a) || x.b.localeCompare(y.b));
  $("#colDna").innerHTML = !pairs.length ? `<div class="muted">${T("dnaNone")}</div>`
    : !shownPairs.length ? `<div class="muted">${T("nothingFilt")}</div>`
    : `<div class="scroll"><table><thead><tr><th>${T("parent1")}</th><th>${T("parent2")}</th><th>${T("result")}</th><th>${T("dnaDp")}</th><th>${T("dnaLv")}</th><th>${T("dnaQ")}</th></tr></thead><tbody>${
        shownPairs.map(x=>{ const nd = EVO_LV[D.get(x.r)?.st];
          const lvc = x.lv==null ? `<span class="muted">—</span>`
            : `<span class="dp">${x.lv}</span>${nd!=null?` <span class="lock${x.lv<nd?" lv-bad":""}">${x.lv>=nd?T("lvNext",topStage(D.get(x.r)?.st,x.lv)):T("lvNoNext",nd)}</span>`:""}`;
          return `<tr><td>${picSt(x.a)}</td><td>${picSt(x.b)}</td><td>${pic(x.r)} <strong>${link(x.r)}</strong> ${stageTag(D.get(x.r)?.st)} ${own(x.r)}</td><td>${dpCell(x)}</td><td style="white-space:nowrap">${lvc}</td><td style="white-space:nowrap">${qCell(x)}</td></tr>`; }).join("")}</tbody></table></div>`;

  // melhor fusão para cada resultado (para o botão "+ Lista")
  const bestFor = new Map();
  const betterP = (n,o) => (n.lv??-1) - (o.lv??-1) || (n.q??-1) - (o.q??-1) || n.dp - o.dp;
  for (const x of pairs){ const o = bestFor.get(x.r); if (!o || betterP(x,o)>0) bestFor.set(x.r, x); }
  // novos ao alcance
  const nNew = [...reach.keys()].filter(r=>!owned.has(r)).length;
  const keys = [...reach.keys()].filter(show).sort(sortByStage);
  $("#colNew").innerHTML = keys.length ? keys.map(r=>{
    const w = reach.get(r);
    const evo = uniq(w.evo).map(o=>`<span class="cx ev">${esc(T("evoFromW", o))}</span>`).join("");
    const dna = w.dna.slice(0,6).map(([a,b])=>`<span class="cx dna">DNA ${esc(a)} + ${esc(b)}</span>`).join("")
      + (w.dna.length>6 ? `<span class="cx dna"><i>+${w.dna.length-6}</i></span>` : "");
    return `<div class="reach"><span class="rt">${picSt(r)}${owned.has(r)?own(r):""}</span><span class="ways">${evo}${dna}</span>
      <button class="mini" data-add="${esc(r)}" data-lv="${bestFor.get(r)?.lv??""}" data-q="${bestFor.get(r)?.q??""}" data-dp="${bestFor.get(r)?.dp??0}">${T("addToList")}</button></div>`;
  }).join("") : `<div class="muted">${(onlyNew&&!st&&!f) ? T("newEmpty") : T("nothingFilt")}</div>`;

  $("#colSum").innerHTML = `<div>${T("colSummary", nEvo, pairs.length, nNew, nWait)}${nLv?T("colBlockedLv", nLv):""}</div>`;
}
const qCell = x => x.q==null ? `<span class="muted">—</span>` : `<span class="dp">${x.q}</span>`;
const dpCell = x => { const nx = (evoFrom.get(x.r)||[]).filter(e=>dpOk(e,x.dp)).map(e=>link(e.to));
  return `<span class="dp">DP ${x.dp}</span>${nx.length?` <span class="lock">${T("dpThen")}</span> ${nx.join(T("or"))}`:""}`; };
const renderCol = () => { renderColList(); renderColOut(); };

$("#colBulkB").onclick = () => {
  const bad = []; let ok = 0;
  $("#colBulkTxt").value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
    const m = line.match(/^(.+?)(?:\s*[:=–-]?\s*(\d+))?(?:\s*[\/:;-]?\s*(?:lv\.?|nv\.?)?\s*(\d+))?(?:\s*[\/:;-]?\s*(?:q\.?|qual\.?|cal\.?)?\s*(\d+))?\s*$/i);
    const byName = resolveLoose(m[1].trim()), n = byName || resolveLoose(line);
    if (!n){ bad.push(line); return; }
    COL.push({id:newId(), n, dp: byName ? cleanDp(m[2]) : 0, lv: byName ? cleanLv(m[3]) : null, q: byName ? cleanQ(m[4]) : null}); ok++;
  });
  saveCol();
  colUndo = null; colMsg = [ok ? T("colAdded", ok) : "", bad.length ? T("colUnknown", bad.map(esc).join(", ")) : ""].filter(Boolean).join(" ");
  if (!bad.length) $("#colBulkTxt").value = "";
  renderCol();
};

// ---------- CADEIA (planejador com DP / Lv máx / Qualidade) ----------
const CH_MAXCOST = 40, CH_MAXPOP = 200000, CH_MAXDONE = 7000;
const FUSP = new Set(DATA.fus.flatMap(([r,a,b])=>[a,b]));   // quem pode ser pai em fusão
const lvOf = v => v==null ? 999 : v;
const lvNeedOk = (lv, need) => need==null || lv==null || lv>=need;
function chCombine(a, b){   // regras de DNA desta versão
  const lv = (a.lv==null||b.lv==null) ? null : Math.min(99, Math.max(a.lv,b.lv) + Math.floor(Math.min(a.lv,b.lv)/5));
  let q = null;
  if (a.lv!=null && b.lv!=null){ if (a.lv>b.lv) q=a.q; else if (b.lv>a.lv) q=b.q; else q=(a.q==null||b.q==null)?null:Math.max(a.q,b.q); }
  return {dp:Math.min(99, Math.max(a.dp,b.dp)+1), lv, q};
}
function chEvolve(n){   // evoluções possíveis a partir de um nó (DP e Lv máx se mantêm)
  const need = EVO_LV[D.get(N[n.i])?.st];
  if (need==null || !lvNeedOk(n.lv, need)) return [];
  return (evoFrom.get(N[n.i])||[]).filter(e=>dpOk(e,n.dp)).map(e=>({i:IDX.get(e.to), dp:n.dp, lv:n.lv, q:n.q, kind:"evo", at:need,
    from:[n], cost:n.cost+1, owns:n.owns}));
}
function chainPlan(target, minLv, cap){
  const ti = IDX.get(target);
  // folhas: Digimons da lista e capturas
  const leaves = COL.map((x,k)=>({i:IDX.get(x.n), dp:x.dp, lv:x.lv, q:x.q, kind:"own", cost:0, owns:[k]}));
  if (cap.on) N.forEach((n,i)=>{ if (cap.st.includes(D.get(n)?.st)) leaves.push({i, dp:0, lv:cap.lv, q:null, kind:"cap", cost:1, owns:[]}); });
  // parceiros: folhas + evoluções delas
  const pool = []; const st = [...leaves];
  while (st.length){ const n = st.pop(); pool.push(n); if (n.cost<6) st.push(...chEvolve(n)); }
  // busca pela menor cadeia (custo = capturas + evoluções + fusões)
  const best = new Map(), buckets = [];
  const push = n => {
    if (n.cost>CH_MAXCOST) return;
    const k = n.i*128+n.dp, l = best.get(k)||[];
    if (l.some(e=>lvOf(e.lv)>=lvOf(n.lv) && e.cost<=n.cost)) return;
    best.set(k, l.filter(e=>!(lvOf(n.lv)>=lvOf(e.lv) && n.cost<=e.cost)).concat([n]));
    (buckets[n.cost] ||= []).push(n);
  };
  pool.forEach(push);
  const goals = [], done = []; let pops = 0;
  for (let c=0; c<=CH_MAXCOST && goals.length<40 && pops<CH_MAXPOP; c++){
    const B = buckets[c]; if (!B) continue;
    for (let bi=0; bi<B.length && pops<CH_MAXPOP; bi++){
      const n = B[bi]; pops++;
      const l = best.get(n.i*128+n.dp); if (!l || !l.includes(n)) continue;   // foi superado
      if (n.i===ti && lvNeedOk(n.lv, minLv)){ goals.push(n); continue; }
      chEvolve(n).forEach(push);
      if (!FUSP.has(n.i)) continue;          // Rookies e afins não entram em fusão
      done.push(n);
      if (done.length>CH_MAXDONE) continue;
      for (const p of done){
        const r = FUS.get(pairKey(n.i,p.i)); if (r==null) continue;
        if (p.owns.length && p.owns.some(o=>n.owns.includes(o))) continue;   // não usar o mesmo Digimon duas vezes
        const c2 = chCombine(n,p);
        push({i:r, ...c2, kind:"dna", from:[n,p], cost:n.cost+p.cost+1, owns:n.owns.concat(p.owns)});
      }
    }
  }
  // opções diferentes, das mais curtas para as mais longas
  const sig = n => n.kind==="own"||n.kind==="cap" ? n.kind+n.i : n.kind+n.i+"("+n.from.map(sig).join(",")+")";
  const seen = new Set(), out = [];
  goals.sort((a,b)=>a.cost-b.cost || lvOf(b.lv)-lvOf(a.lv) || (b.q??-1)-(a.q??-1));
  for (const g of goals){ const k = sig(g); if (seen.has(k)) continue; seen.add(k); out.push(g); if (out.length>=5) break; }
  return out;
}
function chCount(n, acc={st:0,cap:0,own:0}){
  if (n.kind==="cap") acc.cap++; else if (n.kind==="own") acc.own++; else acc.st++;
  (n.from||[]).forEach(c=>chCount(c,acc)); return acc;
}
function chNodeHtml(n, goal){
  const d = D.get(N[n.i]);
  const badge = n.kind==="own" ? `<span class="gbadge own">${T("chYours")}</span>` : n.kind==="cap" ? `<span class="gbadge cap">${T("chGet")}</span>` : "";
  const stats = [`DP ${n.dp}`, `${T("colLv")} ${n.lv??"—"}`].concat(n.q!=null?[`${T("colQs")} ${n.q}`]:[]).join(" · ");
  let h = `<div class="gt"><div class="gcard${n.kind==="own"?" own":""}${goal?" goal":""}"><div class="gn">${link(N[n.i])} ${stageTag(d?.st)} ${badge}</div><div class="gs">${stats}</div></div>`;
  if (n.kind==="evo") h += `<div class="glbl ev">${T("chEvAt", n.at)}</div><div class="gkids">${chNodeHtml(n.from[0])}</div>`;
  if (n.kind==="dna") h += `<div class="glbl dna">${T("chDna")}</div><div class="gkids">${n.from.map(c=>chNodeHtml(c)).join("")}</div>`;
  return h + `</div>`;
}
function chStepsHtml(g){
  const out = [];
  const walk = n => { (n.from||[]).forEach(walk);
    if (n.kind==="cap") out.push(T("chSCap", link(N[n.i])));
    else if (n.kind==="own") out.push(T("chSOwn", link(N[n.i])));
    else if (n.kind==="evo") out.push(T("chSEvo", link(N[n.from[0].i]), link(N[n.i]), n.at));
    else out.push(T("chSDna", link(N[n.from[0].i]), link(N[n.from[1].i]), `<strong>${link(N[n.i])}</strong>`)); };
  walk(g); return `<ol class="gsteps">${out.map(x=>`<li>${x}</li>`).join("")}</ol>`;
}
let chRes = null, chSel = 0, chKey = "";
const chOpts = () => ({ want: resolveLoose($("#chWant").value), minLv: cleanLv($("#chMinLv").value),
  cap: {on:$("#chCap").checked, lv:cleanLv($("#chCapLv").value)??13, st:[...document.querySelectorAll(".chSt:checked")].map(x=>x.value)} });
try { const c = JSON.parse(localStorage.getItem("dw2guia.chcap")||"null");
  if (c){ $("#chCap").checked = !!c.on; if (c.lv) $("#chCapLv").value = c.lv; document.querySelectorAll(".chSt").forEach(x=>x.checked = (c.st||[]).includes(x.value)); } } catch(e) {}
function renderCh(){
  const o = chOpts();
  try { localStorage.setItem("dw2guia.chcap", JSON.stringify(o.cap)); } catch(e) {}
  if (!o.want){ $("#chOut").innerHTML = `<div class="msg">${T("chPick")}</div>`; chKey=""; return; }
  if (!COL.length && !o.cap.on){ $("#chOut").innerHTML = `<div class="msg">${T("chEmpty")}</div>`; return; }
  const key = JSON.stringify([o, COL]);
  if (key!==chKey){
    chKey = key; chSel = 0;
    $("#chOut").innerHTML = `<div class="msg">${T("chCalc")}</div>`;
    setTimeout(()=>{ if (chKey!==key) return; chRes = chainPlan(o.want, o.minLv, o.cap); drawCh(); }, 10);
    return;
  }
  drawCh();
}
function drawCh(){
  if (!chRes || !chRes.length){ $("#chOut").innerHTML = `<div class="msg">${T("chNone")}</div>`; return; }
  const g = chRes[chSel], cnt = chCount(g);
  if (g.kind==="own"){ $("#chOut").innerHTML = `<div class="msg">${T("chHaveIt")}</div>`; return; }
  $("#chOut").innerHTML = (chRes.length>1 ? `<div class="plan-tabs">${chRes.map((r,i)=>`<button class="mini${i===chSel?" on":""}" data-ch="${i}">${T("chPlan", i+1)}</button>`).join("")}</div>` : "")
    + `<div class="muted" style="font-size:12px;margin-bottom:8px">${T("chMeta", cnt.st, cnt.cap, cnt.own)}</div>`
    + `<div class="gwrap">${chNodeHtml(g, true)}</div>`
    + `<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--muted)">${T("chSteps")}</summary>${chStepsHtml(g)}</details>`
    + (cnt.cap ? `<div class="muted" style="font-size:12px;margin-top:8px">${T("chNote")}</div>` : "");
}
$("#chOut").addEventListener("click", e=>{ const b = e.target.closest("[data-ch]"); if (!b) return; chSel = +b.dataset.ch; drawCh(); });
["#chWant","#chMinLv","#chCap","#chCapLv"].forEach(s=>$(s).addEventListener("input", renderCh));
document.querySelectorAll(".chSt").forEach(x=>x.addEventListener("input", renderCh));

  elG_read:["Lee: fila = elemento del ataque; columna = especialidad del Digimon golpeado.","“—” = neutro. Los bonos se multiplican con el suelo y el tipo."],
  elG_floorT:"Suelo (casilla del dominio)", elG_floor:["Ataque del elemento del suelo: poder ×1,2","Objetivo con la especialidad del suelo:","  defensa ×1,2 (recibe menos daño)","Vale para ti y para el enemigo"],
  elG_typeT:"Tipo del Digimon (+20% / −20%)",
  elG_formula:"Daño = ⌊ ⌊Tipo × Elemento × Poder × Suelo(ataque)⌋ × Ataque ÷ ⌊Defensa × Suelo(objetivo)⌋ ⌋",
  elSimTitle:"Probar un ataque", elSimHint:"Elige los Digimon (el tipo, la especialidad y el ataque se rellenan solos) o ajusta todo a mano. Ataque y Defensa son opcionales: solo sirven para estimar el daño.",
  elAtk:"Quién ataca", elDef:"Quién recibe", elField:"Campo de batalla",
  elDigi:"Digimon", elSkill:"Ataque", elMoveEl:"Elemento del ataque", elPow:"Poder del ataque", elType:"Tipo", elSpec:"Especialidad",
  elAtkStat:"Ataque", elDefStat:"Defensa", elTile:"Suelo de la batalla", elNoTile:"Suelo normal (sin elemento)", elManual:"— manual —", elSwap:"⇄ Invertir atacante y objetivo",
  elVGood:"Ventaja", elVNeu:"Neutro", elVBad:"Desventaja",
  elFactor:"Factor", elMul:"Multiplicador", elWhy:"Por qué",
  elFType:"Tipo", elFEl:"Elemento", elFTileA:"Suelo en el ataque", elFTileD:"Suelo en la defensa del objetivo", elTotal:"Efecto total en el daño",
  elBeats:(a,b)=>`${a} vence a ${b}`, elLoses:(a,b)=>`${a} pierde contra ${b}`, elNeutral:(a,b)=>`${a} contra ${b}: neutro`,
  elNoneMove:"ataque sin elemento: neutro", elNoneDef:"objetivo sin especialidad: neutro",
  elTileAtk:t=>`ataque de ${t} en suelo de ${t}`, elTileNoAtk:"el ataque no es del elemento del suelo", elNoTileR:"suelo normal",
  elTileDefY:t=>`objetivo de ${t} en suelo de ${t}: defensa ×1,2`, elTileDefN:"la especialidad del objetivo no es la del suelo",
  elDmg:(d,b)=>`Daño estimado: <b>${d}</b> (sin ningún bono sería ${b}).`,
  elRev:(s,v,p)=>`Y su ataque de vuelta (${s}): <b>${v}</b> (${p}).`, elRevNone:"Elige el ataque del objetivo para ver el contraataque.",
  elSrcTitle:"Fuentes y confianza",
  elSrcText:`<p>Reglas armadas con fuentes de la comunidad (no hay documentación oficial):</p>
    <ul>
      <li>Fórmula de daño y regla del suelo: guía de MetalKid en GameFAQs, reproducida en la página antigua de Wikipedia.</li>
      <li>Ciclo de +20% (Fuego → Naturaleza → Máquina → Oscuridad → Agua → Fuego): igual en TV Tropes y en una prueba de daño de la comunidad en GameFAQs, que también midió el ciclo de −20% y vio que Fuego contra Agua es neutro.</li>
      <li>Triángulo Virus → Data → Vaccine: guía de MetalKid y Wikipedia.</li>
    </ul>
    <p class="muted">El redondeo puede cambiar el daño en 1 punto. Las fuentes citan también un valor 0,8 para el suelo, sin decir cuándo se aplica; aquí el suelo solo da bonos. Los críticos y los contraataques no entran en la cuenta.</p>`,
});

const EL_CYCLE = ["Fire","Nature","Machine","Darkness","Water"];   // cada um faz +20% no seguinte
const ELS = ["None","Fire","Nature","Water","Machine","Darkness"];
const EL_COL = {Fire:"#ff7a45", Nature:"#5ad38a", Water:"#4cc2ff", Machine:"#b8c0d0", Darkness:"#a87cff", None:"#94a0b8"};
const TY_CYCLE = ["Virus","Data","Vaccine"];                        // cada um vence o seguinte
const elName = e => T("el_"+e);
const specMul = (m,d) => { const i=EL_CYCLE.indexOf(m), j=EL_CYCLE.indexOf(d); if(i<0||j<0) return 1; const k=(j-i+5)%5; return k===1?1.2:k===2?0.8:1; };
const typeMul = (a,d) => { const i=TY_CYCLE.indexOf(a), j=TY_CYCLE.indexOf(d); if(i<0||j<0) return 1; const k=(j-i+3)%3; return k===1?1.2:k===2?0.8:1; };
const fmtMul = v => "×"+v.toLocaleString(T("locale"),{minimumFractionDigits:1, maximumFractionDigits:2});
const svgT = (x,y,s,a="") => `<text x="${x}" y="${y}" ${a}>${esc(s)}</text>`;

function wheelSVG(){
  const cx=210, cy=190, R=128, r=40;
  const pos = EL_CYCLE.map((e,i)=>{ const a=(-90+i*72)*Math.PI/180; return [cx+R*Math.cos(a), cy+R*Math.sin(a)]; });
  const arrow = (i,j,strong) => {
    const [x1,y1]=pos[i], [x2,y2]=pos[j], dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, g=r+5;
    return `<line x1="${x1+ux*g}" y1="${y1+uy*g}" x2="${x2-ux*(g+3)}" y2="${y2-uy*(g+3)}" style="stroke:${strong?"var(--good)":"var(--bad)"};stroke-width:${strong?3:2}" ${strong?"":`stroke-dasharray="6 5"`} marker-end="url(#${strong?"awG":"awR"})"/>`;
  };
  const lbl = i => { const [x1,y1]=pos[i], [x2,y2]=pos[(i+1)%5], mx=(x1+x2)/2, my=(y1+y2)/2, vx=mx-cx, vy=my-cy, L=Math.hypot(vx,vy);
    return svgT(mx+vx/L*15, my+vy/L*15+4, "+20%", `text-anchor="middle" style="fill:var(--good);font-size:12px;font-weight:700"`); };
  let s = `<svg viewBox="0 0 420 410" role="img" aria-label="${esc(T("elImg1"))}" style="width:100%;max-width:440px;display:block;margin:0 auto">
    <defs>
      <marker id="awG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--good)"/></marker>
      <marker id="awR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--bad)"/></marker>
    </defs>`;
  for (let i=0;i<5;i++) s += arrow(i,(i+2)%5,false);
  for (let i=0;i<5;i++) s += arrow(i,(i+1)%5,true) + lbl(i);
  EL_CYCLE.forEach((e,i)=>{ const [x,y]=pos[i];
    s += `<circle cx="${x}" cy="${y}" r="${r}" style="fill:${EL_COL[e]}22;stroke:${EL_COL[e]};stroke-width:3"/>`
      + svgT(x, y+5, elName(e), `text-anchor="middle" style="fill:${EL_COL[e]};font-size:13px;font-weight:700"`); });
  s += `<line x1="24" y1="352" x2="64" y2="352" style="stroke:var(--good);stroke-width:3" marker-end="url(#awG)"/>`
    + svgT(74, 356, T("elWStrong"), `style="fill:var(--text);font-size:12.5px"`)
    + `<line x1="24" y1="376" x2="64" y2="376" style="stroke:var(--bad);stroke-width:2" stroke-dasharray="6 5" marker-end="url(#awR)"/>`
    + svgT(74, 380, T("elWWeak"), `style="fill:var(--text);font-size:12.5px"`)
    + svgT(24, 403, T("elWNone"), `style="fill:var(--muted);font-size:12px"`);
  return s + `</svg>`;
}

function gridSVG(){
  const x0=118, y0=86, cw=58, ch=38, txt=`style="fill:var(--text);font-size:12px"`, mut=`style="fill:var(--muted);font-size:11.5px"`;
  let s = `<svg viewBox="0 0 800 500" role="img" aria-label="${esc(T("elImg2"))}" style="width:100%;display:block">
    <defs><marker id="awT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--good)"/></marker></defs>`;
  s += svgT(16, 26, T("elG_title"), `style="fill:var(--accent);font-size:15px;font-weight:700"`);
  s += svgT(16, y0-34, T("elG_move"), mut) + svgT(x0, y0-34, T("elG_target"), mut);
  ELS.forEach((d,j)=>{ s += svgT(x0+j*cw+cw/2, y0-12, elName(d), `text-anchor="middle" style="fill:${EL_COL[d]};font-size:11px;font-weight:700"`); });
  ELS.forEach((m,i)=>{
    s += svgT(x0-10, y0+i*ch+ch/2+4, elName(m), `text-anchor="end" style="fill:${EL_COL[m]};font-size:12px;font-weight:700"`);
    ELS.forEach((d,j)=>{ const v=specMul(m,d), x=x0+j*cw, y=y0+i*ch;
      const fill = v>1 ? "rgba(90,211,138,.30)" : v<1 ? "rgba(255,107,107,.30)" : "rgba(148,160,184,.08)";
      const col = v>1 ? "var(--good)" : v<1 ? "var(--bad)" : "var(--muted)";
      s += `<rect x="${x+1}" y="${y+1}" width="${cw-2}" height="${ch-2}" rx="5" style="fill:${fill}"/>`
        + svgT(x+cw/2, y+ch/2+5, v>1?"+20%":v<1?"−20%":"—", `text-anchor="middle" style="fill:${col};font-size:13px;font-weight:700"`); });
  });
  T("elG_read").forEach((l,k)=>{ s += svgT(16, y0+6*ch+28+k*18, l, mut); });
  // chão
  const fx=500, fy=56;
  s += `<rect x="${fx}" y="${fy}" width="284" height="150" rx="10" style="fill:var(--panel2);stroke:var(--line)"/>`
    + svgT(fx+14, fy+26, T("elG_floorT"), `style="fill:var(--accent2);font-size:14px;font-weight:700"`);
  T("elG_floor").forEach((l,k)=>{ s += svgT(fx+14, fy+52+k*22, l, k===3?mut:txt); });
  // tipo
  const ty=[[642,262],[740,392],[544,392]];   // Virus, Data, Vaccine
  s += svgT(fx, 240, T("elG_typeT"), `style="fill:var(--accent2);font-size:14px;font-weight:700"`);
  for (let i=0;i<3;i++){ const [x1,y1]=ty[i], [x2,y2]=ty[(i+1)%3], dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, g=34;
    s += `<line x1="${x1+ux*g}" y1="${y1+uy*g}" x2="${x2-ux*(g+3)}" y2="${y2-uy*(g+3)}" style="stroke:var(--good);stroke-width:2.5" marker-end="url(#awT)"/>`;
    const mx=(x1+x2)/2, my=(y1+y2)/2, vx=mx-642, vy=my-349, VL=Math.hypot(vx,vy);
    s += svgT(mx+vx/VL*16, my+vy/VL*16+4, "+20%", `text-anchor="middle" style="fill:var(--good);font-size:11.5px;font-weight:700"`); }
  TY_CYCLE.forEach((t,i)=>{ const [x,y]=ty[i];
    s += `<rect x="${x-36}" y="${y-15}" width="72" height="30" rx="15" style="fill:var(--panel2);stroke:var(--accent)"/>` + svgT(x, y+5, t, `text-anchor="middle" style="fill:var(--text);font-size:12.5px;font-weight:700"`); });
  s += `<line x1="16" y1="440" x2="784" y2="440" style="stroke:var(--line)"/>`
    + svgT(16, 468, T("elG_formula"), `style="fill:var(--text);font-size:12.5px;font-family:Consolas,monospace"`);
  return s + `</svg>`;
}

// simulador
const EL_SIDE = {a:"#ea", d:"#ed"};
const skillOpts = () => `<option value="">${esc(T("elManual"))}</option>` + [...DATA.skills].sort((x,y)=>x.n.localeCompare(y.n))
  .map(s=>`<option value="${esc(s.n)}">${esc(s.n)} — ${esc(elName(ELS.includes(s.e)?s.e:"None"))} · ${esc(s.p)}</option>`).join("");
function fillElSelects(){
  const keep = {}; document.querySelectorAll("#t-elem select").forEach(s=>keep[s.id]=s.value);
  const elOpts = ELS.map(e=>`<option value="${e}">${esc(elName(e))}</option>`).join("");
  ["#eaEl","#eaSp","#edSp"].forEach(id=>$(id).innerHTML=elOpts);
  $("#elTile").innerHTML = ELS.map(e=>`<option value="${e}">${esc(e==="None"?T("elNoTile"):elName(e))}</option>`).join("");
  ["#eaTy","#edTy"].forEach(id=>$(id).innerHTML=TY_CYCLE.map(t=>`<option>${t}</option>`).join(""));
  ["#eaSkill","#edSkill"].forEach(id=>$(id).innerHTML=skillOpts());
  for (const [id,v] of Object.entries(keep)) if (v!=null && $("#"+id)) $("#"+id).value = v;
}
function elApplySkill(p){
  const s = SK.get($(EL_SIDE[p]+"Skill").value); if (!s) return;
  if (p==="a"){ $("#eaEl").value = ELS.includes(s.e)?s.e:"None"; $("#eaPow").value = s.p; }
}
function elFromDigi(p){
  const n = resolve($(EL_SIDE[p]+"Digi").value); if (!n) return;
  const d = D.get(n);
  if (TY_CYCLE.includes(d.ty)) $(EL_SIDE[p]+"Ty").value = d.ty;
  $(EL_SIDE[p]+"Sp").value = ELS.includes(d.sp) ? d.sp : "None";
  $(EL_SIDE[p]+"Skill").value = SK.has(d.sk) ? d.sk : "";
  elApplySkill(p);
}
function elVerdict(tot){
  const p = Math.round((tot-1)*100), pct = (p>0?"+":p<0?"−":"±")+Math.abs(p)+"%";
  return tot>1.0001 ? {c:"good", t:T("elVGood"), pct} : tot<0.9999 ? {c:"bad", t:T("elVBad"), pct} : {c:"neu", t:T("elVNeu"), pct};
}
function renderElSim(){
  const aTy=$("#eaTy").value, dTy=$("#edTy").value, aEl=$("#eaEl").value, aSp=$("#eaSp").value, dSp=$("#edSp").value, tile=$("#elTile").value;
  const pow=Math.max(0,+$("#eaPow").value||0), atk=Math.max(1,+$("#eaAtk").value||1), def=Math.max(1,+$("#edDef").value||1);
  const ty=typeMul(aTy,dTy), sp=specMul(aEl,dSp), ta=(tile!=="None"&&aEl===tile)?1.2:1, td=(tile!=="None"&&dSp===tile)?1.2:1;
  const tot = ty*sp*ta/td, v = elVerdict(tot), E = 1e-9;
  const dmg = Math.floor(Math.floor(ty*sp*pow*ta+E)*atk/Math.max(1,Math.floor(def*td+E))+E);
  const base = Math.floor(Math.floor(pow+E)*atk/def+E);
  const rel = (m,a,b,f) => m>1 ? T("elBeats",a,b) : m<1 ? T("elLoses",a,b) : f;
  const row = (f,m,why) => `<tr><td>${f}</td><td class="${m>1?"good":m<1?"bad":"muted"}" style="font-weight:700;white-space:nowrap">${fmtMul(m)}</td><td>${why}</td></tr>`;
  const elWhy = aEl==="None" ? T("elNoneMove") : dSp==="None" ? T("elNoneDef") : rel(sp, elName(aEl), elName(dSp), T("elNeutral", elName(aEl), elName(dSp)));
  let html = `<div class="verdict v-${v.c}">${v.t} <span>${v.pct}</span></div>
    <table style="margin-top:10px"><thead><tr><th>${T("elFactor")}</th><th>${T("elMul")}</th><th>${T("elWhy")}</th></tr></thead><tbody>
    ${row(T("elFType"), ty, rel(ty, aTy, dTy, T("elNeutral", aTy, dTy)))}
    ${row(T("elFEl"), sp, elWhy)}
    ${row(T("elFTileA"), ta, tile==="None" ? T("elNoTileR") : ta>1 ? T("elTileAtk", elName(tile)) : T("elTileNoAtk"))}
    ${row(T("elFTileD"), 1/td, tile==="None" ? T("elNoTileR") : td>1 ? T("elTileDefY", elName(tile)) : T("elTileDefN"))}
    <tr><td><b>${T("elTotal")}</b></td><td class="${tot>1.0001?"good":tot<0.9999?"bad":"muted"}" style="font-weight:700">${fmtMul(tot)}</td><td></td></tr>
    </tbody></table>
    <div style="margin-top:10px">${T("elDmg", dmg, base)}</div>`;
  // contra-ataque do alvo
  const rs = SK.get($("#edSkill").value);
  if (rs){ const rEl = ELS.includes(rs.e)?rs.e:"None";
    const rt = typeMul(dTy,aTy)*specMul(rEl,aSp)*((tile!=="None"&&rEl===tile)?1.2:1)/((tile!=="None"&&aSp===tile)?1.2:1), rv = elVerdict(rt);
    html += `<div class="msg" style="margin-top:10px">${T("elRev", `${esc(rs.n)} · ${esc(elName(rEl))}`, `<span class="${rv.c==="neu"?"muted":rv.c}">${rv.t}</span>`, rv.pct)}</div>`; }
  else html += `<div class="muted" style="margin-top:10px;font-size:12px">${T("elRevNone")}</div>`;
  $("#elOut").innerHTML = html;
}
function renderElAll(){
  $("#elWheel").innerHTML = wheelSVG();
  $("#elGrid").innerHTML = gridSVG();
  fillElSelects(); renderElSim();
}
fillElSelects();
["a","d"].forEach(p=>{
  $(EL_SIDE[p]+"Digi").addEventListener("input", ()=>{ elFromDigi(p); renderElSim(); });
  $(EL_SIDE[p]+"Skill").addEventListener("input", ()=>{ elApplySkill(p); renderElSim(); });
});
["#eaEl","#eaPow"].forEach(id=>$(id).addEventListener("input", ()=>{ $("#eaSkill").value=""; renderElSim(); }));
["#eaTy","#eaSp","#eaAtk","#edTy","#edSp","#edDef","#elTile"].forEach(id=>$(id).addEventListener("input", renderElSim));
$("#elSwap").onclick = () => {
  for (const f of ["Digi","Ty","Sp","Skill"]){ const a=$("#ea"+f), d=$("#ed"+f), t=a.value; a.value=d.value; d.value=t; }
  elApplySkill("a"); renderElSim();
};
$("#eaDigi").value = "Agumon"; elFromDigi("a");
$("#edDigi").value = "Palmon"; elFromDigi("d");

// ---------- troca de idioma ----------
function applyLang(){
  document.documentElement.lang = LANG==="pt" ? "pt-BR" : LANG;
  document.title = T("title");
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=T(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el=>el.innerHTML=T(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=T(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-title]").forEach(el=>el.title=T(el.dataset.i18nTitle));
  document.querySelectorAll("#sCat option[value]:not([value=''])").forEach(o=>o.textContent=cat(o.value));
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG));
}
function renderAll(){
  renderDList(); if(curDigi) selectDigi(curDigi);
  renderE(); renderT(); renderC(); renderQ(); renderW();
  if(planCache.res) drawP(resolve($("#pHave").value),resolve($("#pWant").value)); else renderP();
  renderS(); renderCol(); renderCh(); renderElAll();
}
$("#lang").onclick = e => { const l=e.target.dataset.l; if(!l||l===LANG) return;
  LANG=l; try{ localStorage.setItem("dw2guia.lang", l); }catch(err){}
  applyLang(); renderAll(); };

// ---------- início ----------
applyLang();
curDigi = "Agumon";
renderAll();
</script>
